<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LSAT Test Bloque 1</title>
<meta name="description" content="Test de teoría del Bloque 1 de Líneas Subterráneas de AT y CT (ETSIDI-UPM): 174 frases V/F de exámenes y cuestionarios oficiales, explicadas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: una columna de estudio de ~640px; cabecera fija con progreso; tarjeta de pregunta con opciones táctiles grandes. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#16202C; --muted:#5B6878; --line:#D9DFE7; --soft:#EAEEF3;
  --t1:#2F5D8C; --t2:#7A4E9C; --t23:#8C5A2F; --t3:#2E7D6B; --t4:#2F5D8C; --t6:#7A4E9C; --t7:#2E7D6B; --tx:#6B7785;
  --ok:#1E7A46; --okbg:#E5F3EA; --ko:#B23434; --kobg:#FBE9E9; --warn:#8A5A00; --warnbg:#FCF3DE;
  --paper:#FFFFFF;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --accent:var(--t1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151C; --surface:#18212B; --ink:#E6ECF2; --muted:#93A1B1; --line:#2B3744; --soft:#212C38;
  --t1:#6FA3D6; --t2:#B48BD6; --t23:#D29A63; --t3:#5FC0A8; --t4:#6FA3D6; --t6:#B48BD6; --t7:#5FC0A8; --tx:#93A1B1;
  --ok:#5CCB8A; --okbg:#173527; --ko:#F07A7A; --kobg:#3A1D1F; --warn:#E5B85C; --warnbg:#3A2F16;
  --paper:#F4F6F8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151C; --surface:#18212B; --ink:#E6ECF2; --muted:#93A1B1; --line:#2B3744; --soft:#212C38;
  --t1:#6FA3D6; --t2:#B48BD6; --t23:#D29A63; --t3:#5FC0A8; --t4:#6FA3D6; --t6:#B48BD6; --t7:#5FC0A8; --tx:#93A1B1;
  --ok:#5CCB8A; --okbg:#173527; --ko:#F07A7A; --kobg:#3A1D1F; --warn:#E5B85C; --warnbg:#3A2F16;
  --paper:#F4F6F8; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:660px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono)}

/* ---------- inicio */
.hero{padding-block:28px 8px;display:grid;gap:6px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:clamp(30px,8vw,42px);font-weight:800;letter-spacing:-.01em;line-height:1.05}
.hero p{margin:0;color:var(--muted);max-width:56ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-block:18px 6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.sec{margin-top:22px;display:grid;gap:10px}
.sec h2{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.modes{display:grid;gap:10px}
.mode{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer}
.mode:hover{border-color:var(--accent)}
.mode .ic{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;background:var(--soft);font-family:var(--f-mono);font-weight:600;font-size:14px}
.mode h3{font-size:17px;font-weight:700}
.mode p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.mode .n{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.mode.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mode.primary p,.mode.primary .n{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.mode.primary .ic{background:color-mix(in srgb,var(--bg) 16%,transparent)}
.temas{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tema{text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:12px 14px;cursor:pointer;display:grid;gap:2px}
.tema b{font-family:var(--f-display);font-size:16px;color:var(--c)}
.tema span{font-size:13px;color:var(--muted)}
.tema .bar{height:4px;background:var(--soft);border-radius:4px;margin-top:6px;overflow:hidden}
.tema .bar i{display:block;height:100%;background:var(--ok);width:0}
.opts{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:14px;color:var(--muted)}
.opts label{display:flex;gap:8px;align-items:center;cursor:pointer}
.opts input{width:18px;height:18px;accent-color:var(--accent)}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px}
.tip{background:var(--warnbg);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:14px}
.tip b{color:var(--warn)}

/* ---------- barra superior del quiz */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:grid;gap:8px}
.toprow{display:flex;align-items:center;gap:10px}
.back{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px}
.title{flex:1;min-width:0;font-family:var(--f-display);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-family:var(--f-mono);font-size:13px;display:flex;gap:10px;font-variant-numeric:tabular-nums}
.score .g{color:var(--ok)} .score .r{color:var(--ko)}
.prog{height:6px;background:var(--soft);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

/* ---------- tarjeta */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:8px;overflow:hidden}
.chead{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:12px 16px;background:var(--soft);border-bottom:1px solid var(--line)}
.qid{font-family:var(--f-mono);font-weight:600;font-size:14px;color:var(--accent);margin-right:auto}
.chip{font-size:11.5px;line-height:1;padding:5px 7px;border-radius:5px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.hot{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.chip.no{background:var(--kobg);color:var(--ko);border-color:transparent;font-weight:600}
.chip.dud{background:var(--warnbg);color:var(--warn);border-color:transparent;font-weight:600}
.cbody{padding:18px 16px 16px;display:grid;gap:14px}
.q{font-size:18px;font-weight:600;line-height:1.4}
.hint{font-size:13px;color:var(--muted);margin-top:-6px}
.fig{background:var(--paper);border-radius:10px;padding:10px;overflow-x:auto;color:#16202C}
.fig svg{display:block;width:100%;height:auto;max-width:520px;margin:0 auto}
.fig img{display:block;margin:0 auto;border-radius:6px;max-width:100%;height:auto}
.choices{display:grid;gap:10px}
.ch{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start;text-align:left;width:100%;cursor:pointer;
  background:var(--surface);border:1.5px solid var(--line);border-radius:11px;padding:12px 12px;min-height:52px;transition:border-color .15s,background .15s}
.ch:hover:not([disabled]){border-color:var(--accent)}
.ch .l{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--soft);font-family:var(--f-mono);font-weight:600;font-size:14px}
.ch .t{padding-top:4px;min-width:0;overflow-wrap:anywhere}
.ch .m{padding-top:4px;font-family:var(--f-mono);font-size:12px;font-weight:600}
.ch.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.ch.sel .l{background:var(--accent);color:var(--surface)}
.ch.ok{border-color:var(--ok);background:var(--okbg)}
.ch.ok .l{background:var(--ok);color:var(--surface)}
.ch.ok .m{color:var(--ok)}
.ch.ko{border-color:var(--ko);background:var(--kobg)}
.ch.ko .l{background:var(--ko);color:var(--surface)}
.ch.ko .m{color:var(--ko)}
.ch.miss{border-color:var(--ok);border-style:dashed}
.ch.miss .m{color:var(--ok)}
.ch[disabled]{cursor:default}
.ch.dim{opacity:.6}
/* emparejar */
.match{display:grid;gap:10px}
.mrow{display:grid;gap:6px;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px}
.mrow .it{font-weight:600}
.mrow select{font:inherit;font-size:15px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.mrow.ok{border-color:var(--ok);background:var(--okbg)}
.mrow.ko{border-color:var(--ko);background:var(--kobg)}
.mrow .sol{font-size:13.5px;color:var(--ok);font-weight:600}
/* respuesta abierta */
.reveal{display:grid;gap:10px}
.ans{background:var(--okbg);border-radius:11px;padding:12px 14px}
.ans .lbl,.exp .lbl{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--ok);margin-bottom:4px}
.exp{border-top:1px solid var(--line);padding-top:12px;font-size:15px;color:var(--ink)}
.exp .lbl{color:var(--muted)}
.ojo{background:var(--warnbg);border-radius:10px;padding:10px 12px;font-size:14.5px}
.ojo b{color:var(--warn)}
.verdict{display:flex;align-items:center;gap:10px;font-weight:700;font-family:var(--f-display);font-size:17px}
.verdict.ok{color:var(--ok)} .verdict.ko{color:var(--ko)}
.exp table,.ans table{border-collapse:collapse;font-size:14px;width:100%}
.exp td,.exp th,.ans td,.ans th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
.tbl{overflow-x:auto}
.actions{display:flex;flex-wrap:wrap;gap:10px;padding:0 16px 16px}
.btn{flex:1 1 140px;border:0;border-radius:10px;padding:13px 16px;font-weight:600;cursor:pointer;background:var(--ink);color:var(--bg);font-size:16px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.good{background:var(--ok);color:var(--surface)}
.btn.bad{background:var(--ko);color:var(--surface)}
.btn[disabled]{opacity:.45;cursor:default}
.kbd{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
/* resultados */
.res{display:grid;gap:14px;margin-top:14px}
.big{font-family:var(--f-display);font-size:56px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:22px;color:var(--muted);font-weight:600}
.rlist{display:grid;gap:8px}
.ritem{display:flex;gap:10px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ko);border-radius:9px;padding:10px 12px;font-size:14.5px}
.ritem .mono{color:var(--ko);font-size:13px;flex:none}
mjx-container{overflow-x:auto;overflow-y:hidden;max-width:100%}
mjx-container[display="true"]{margin:.4em 0!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:420px){.temas{grid-template-columns:1fr}.q{font-size:17px}}

/* ---------- añadidos Parcial 2 */
.ver{font-weight:400;color:var(--muted);font-size:14px}
.chip.new{background:color-mix(in srgb,var(--t4) 14%,var(--surface));color:var(--t4);border-color:transparent;font-weight:600}
.star{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer;color:var(--muted);font-size:14px;line-height:1}
.star.on{color:#C99A12;border-color:#C99A12;background:color-mix(in srgb,#C99A12 12%,var(--surface))}
.mode.new{border-left:4px solid var(--t4)}
.mode[disabled]{opacity:.55;cursor:default}
.tema .g{font-size:11.5px;font-family:var(--f-mono);color:var(--muted)}
.ref{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.verdict.mut{color:var(--muted)}
.fig .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fig .cap{font-size:12.5px;text-align:center;color:#5B6878;font-weight:600;margin-bottom:2px}
@media (max-width:560px){.fig .two{grid-template-columns:1fr}}
.tbs{display:grid;gap:8px}
.tb{display:grid;grid-template-columns:96px 1fr 48px;gap:10px;align-items:center;font-size:14px}
.tb b{font-family:var(--f-display)}
.tb .bar{height:8px;background:var(--soft);border-radius:6px;overflow:hidden}.tb .bar i{display:block;height:100%;background:var(--ok)}
.tb .mono{text-align:right;color:var(--muted);font-size:13px}
.ritem.ok{border-left-color:var(--ok)} .ritem.ok .mono{color:var(--ok)}
.ritem.bl{border-left-color:var(--line)} .ritem.bl .mono{color:var(--muted)}
.ritem .mono{min-width:64px}
table.mini{border-collapse:collapse;width:100%;font-size:14px;margin:4px 0}
table.mini td,table.mini th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
.ans .tbl,.exp .tbl{overflow-x:auto}

:root{--c1:#2F5D8C;--c2:#7A4E9C;--c3:#8C5A2F;--c41:#2E7D6B;--c42:#5E6B2F;--c5:#B0473A;--c6:#2F6E8C;--c7:#6B3F7A;--accent:var(--c1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c1:#6FA3D6;--c2:#B48BD6;--c3:#D29A63;--c41:#5FC0A8;--c42:#B5C16A;--c5:#EE8A7C;--c6:#6CB6D8;--c7:#C49AD6}}
:root[data-theme="dark"]{--c1:#6FA3D6;--c2:#B48BD6;--c3:#D29A63;--c41:#5FC0A8;--c42:#B5C16A;--c5:#EE8A7C;--c6:#6CB6D8;--c7:#C49AD6}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.vf .ch{justify-content:center;align-items:center}.vf .ch .m{display:none}.vf .ch .t{flex:none;font-weight:600}
.tag{font-size:12px;font-weight:600;letter-spacing:.02em;margin-bottom:6px;text-transform:uppercase}
.chip.off{border-style:dashed}
mark{background:color-mix(in srgb,var(--warn) 22%,transparent);color:inherit;border-radius:3px;padding:0 2px;font-weight:600}
.twin{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--soft)}
.twin .lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.trow{display:flex;gap:10px;align-items:flex-start;padding:4px 0;font-size:15px}
.tvf{flex:none;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;margin-top:1px}
.tvf.v{background:var(--ok)}.tvf.f{background:var(--ko)}
.lead{color:var(--muted);margin:14px 0 6px}
.idea{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:12px 14px;margin:12px 0}
.ihead{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:17px;margin-bottom:4px}
.ihead b{color:var(--c)}.ihead .btn{margin-left:auto}
.btn.sm{padding:6px 10px;font-size:13px;min-height:0}
.idea ul{margin:0;padding-left:18px}.idea li{margin:6px 0;line-height:1.45}
</style>
</head>

<script>
const TEMAS={"T1": {"n": "T1", "t": "Redes de AT", "v": "--c1"}, "T2": {"n": "T2", "t": "Cables: constitución y tipos", "v": "--c2"}, "T3": {"n": "T3", "t": "Empalmes y terminaciones", "v": "--c3"}, "T4.1": {"n": "T4.1", "t": "Puesta a tierra de pantallas", "v": "--c41"}, "T4.2": {"n": "T4.2", "t": "ITC-LAT 06", "v": "--c42"}, "T5": {"n": "T5", "t": "Parámetros eléctricos", "v": "--c5"}, "T6": {"n": "T6", "t": "Intensidad admisible", "v": "--c6"}, "T7": {"n": "T7", "t": "Sobrecarga y cortocircuito", "v": "--c7"}};
const IDEAS={"T1": ["<b>Estados de la red.</b> Normal: todo en márgenes. <b>Alerta</b>: $U$ <i>y</i> $f$ dentro, pero la carga o la potencia no garantizada no cumplen la fiabilidad. <b>Emergencia</b>: $U$ <i>o</i> $f$ fuera.", "<b>Huso.</b> Subestación → líneas → <b>centro de reflexión</b> ← <b>línea 0</b>. La línea 0 está <b>en tensión y sin carga</b>. El centro de reflexión <b>solo alimenta si hay un fallo</b>. Socorro del 100&nbsp;%.", "<b>Huso apoyado</b> = dos husos que comparten el centro de reflexión → <b>2 líneas 0</b> desde 2 subestaciones.", "<b>Espiga</b> = un huso dentro de otro → <b>2 centros de reflexión</b> y <b>2 líneas 0</b> (también en tensión).", "<b>Anillo (pétalo).</b> Sale y vuelve a la misma subestación o centro de reparto. Se explota <b>abierto</b> (radial) y socorre el 50&nbsp;%. <b>Anillo apoyado</b>: vuelve a otra. Nada de centro de reflexión.", "<b>Centro de reparto</b>: fuertemente alimentado, <b>con protecciones</b> y aparatos de maniobra.", "<b>Subterránea frente a aérea</b>: más pérdidas, menos riesgo de incendio. En CA, a larga distancia (islas, eólica marina, Madrid-Barcelona) no sirve por la longitud crítica → <b>HVDC</b>.", "$U_s$ = tensión máxima en condiciones <b>normales</b> → dimensiona el <b>aislamiento</b>. El autoseccionador abre tras <b>2</b> disparos. Racimo: 8 CT, 800&nbsp;kVA, 4&nbsp;km.", "Las líneas <b>sí</b> se pueden sobrecargar (de forma controlada y temporal). Las redes urbanas cumplen el criterio $n-1$."], "T2": ["<b>Orden de capas</b>: conductor | semic. interna | aislamiento | <b>semic. externa</b> | pantalla | (armadura) | cubierta. <b>Nunca</b> hay semiconductora entre pantalla y cubierta.", "<b>Semiconductoras</b>: homogeneizan el campo y evitan descargas parciales en la interfaz con el aislamiento. Los huecos entre los alambres y la semic. interna no importan: allí no hay campo.", "<b>Pantalla</b>: confina el campo (en la cubierta $E=0$, en AT y en MT) y deriva las corrientes capacitivas y de defecto. La armadura <b>no</b> sustituye a la pantalla.", "<b>Armadura</b>: unipolar → <b>no magnética</b>; tripolar → puede ser magnética. En toda armadura conductora (también de Al) <b>se inducen corrientes</b>.", "<b>Aislamientos</b>: XLPE 90/250&nbsp;ºC (termoestable) · <b>HEPR 105&nbsp;ºC, solo MT</b> · EPR hasta 220&nbsp;kV · PE hasta 400&nbsp;kV · PPLP 760&nbsp;kV · PVC no en AT por su $\\tan\\delta$ (su rigidez, 200-400&nbsp;kV/cm, no es peor que la del XLPE, 300).", "<b>Cubiertas</b>. Mecánica: <b>PE > TPO > PVC > TPR</b>. Humos: PVC > PE > TPO > TPR. Los humos del PVC son tóxicos.", "<b>Fuego</b>: (S) no propagador de la <i>llama</i> · (AS) no propagador del <i>incendio</i> · (AS+) resistente al fuego. <b>“S+” no existe.</b>", "<b>Designación</b>: R = XLPE · D = EPR · HEPR · Z1 = poliolefina · V = PVC · 2OL = obturación en conductor y pantalla · K = compacto · <b>H16 = pantalla de 16&nbsp;mm² de Cu</b>.", "<b>Milliken</b> (segmentado) por encima de 1000&nbsp;mm², para reducir el <b>efecto pelicular</b>. <b>Obturación radial</b> = vaina estanca que puede hacer de pantalla."], "T3": ["<b>Cono deflector</b>: al final de la semiconductora <b>externa</b>, en terminaciones y en empalmes. Sobre el manguito va el <i>electrodo de unión</i>, no el deflector.", "<b>Empalme normal</b> (pantalla continua): solid bonding y dentro de un tramo single-point. <b>Empalme seccionado</b>: cross-bonding.", "Pantallas a limitadores con <b>cable concéntrico</b>, que tiene menor inductancia.", "<b>Terminaciones</b>: GIS secas o con fluido (ni prohibido ni obligatorio). Línea de fuga = mm/kV × $U_s$, también en las de interior.", "<b>Montaje</b>: termorretráctil = diámetro mayor que se contrae con calor · contráctil en frío = se libera un soporte · enfilable = se empuja sobre el cable.", "<b>Enchufables</b>: hasta 36&nbsp;kV, apantalladas, con divisor capacitivo, pueden ser atornillables."], "T4.1": ["<b>Solid bonding</b> (ambos extremos a tierra): circula corriente por las pantallas → pérdidas $\\lambda_1'$. <b>La R aparente sube y la X baja.</b>", "<b>Single-point</b>: un solo extremo a tierra → <b>sin corriente de circulación</b> ($\\lambda_1'=0$, solo Foucault), pero <b>sí corriente capacitiva</b>. Tensión inducida en el extremo libre → <b>descargador pantalla-tierra</b>.", "<b>Cable equipotencial</b> (en SP): a tierra en <b>ambos extremos</b>; por él vuelve la corriente de falta.", "<b>Cross-bonding</b>: tramos casi iguales (500-600&nbsp;m), empalmes seccionados, limitadores en cada cruce. Con una falta fase-tierra <b>sí</b> hay corrientes y sobretensiones en las pantallas.", "<b>Limitadores: siempre entre pantalla y tierra</b>, nunca entre conductor y pantalla."], "T4.2": ["<b>Bajo tubo</b>: no hace falta placa de protección, pero <b>sí cinta de señalización</b>. La profundidad es la misma.", "<b>Gas</b>: debajo de depósitos, <b>permitido</b> con condiciones (1,2&nbsp;m, tubos que sobresalen 2&nbsp;m). En una galería con gas, <b>prohibido</b>.", "<b>AT por debajo de BT</b> (a 0,25&nbsp;m). En galería, separar por tensiones (no hay regla de “comunicaciones encima”).", "<b>Pararrayos</b> en el paso aéreo-subterráneo: “<i>cuando deban</i> instalarse” → no siempre."], "T5": ["<b>Inductancia</b>: trébol < capa (mayor DMG en capa).", "<b>Pelicular</b>: segmentado < hueco < compacto. Crece con la sección o el diámetro (menos $R$, más $x_s$).", "<b>Proximidad</b>: crece con la sección y con $d_c/s$. Capa < trébol con la misma S (tabla de la T5, p.&nbsp;16).", "<b>Dieléctricas</b>: $W_d=\\omega C U_0^2\\tan\\delta$ → ∝ $U^2$; PVC ≫ XLPE; la $\\tan\\delta$ <b>sube</b> al envejecer. Las pérdidas en pantallas no dependen del aislamiento.", "<b>Campo</b>: $E(x)=\\dfrac{U_0}{x\\ln(R/r)}$ → máximo junto al <b>conductor</b>. En campo radial, capacidad entre fases = 0.", "<b>Pantalla en SB</b>: $\\lambda_1'=\\dfrac{R_s}{R}\\dfrac{1}{1+(R_s/X)^2}$ → 0 si $R_s\\to0$.", "<b>Longitud crítica</b>: $L_c=\\dfrac{\\sqrt3\\,I_z}{\\omega C U}$, inversamente proporcional a $C$ y a $U$ por igual; frente a la sección, manda la tensión."], "T6": ["<b>Iz baja</b> si: va bajo tubo (aire del tubo), está más profundo, la $\\rho_T$ es mayor (térmica, no eléctrica) o la cubierta es de PVC (más $T_3$ y límite de 70&nbsp;ºC)."], "T7": ["<b>Sobrecarga</b>: sí se puede, de forma temporal. Más sección → más tiempo ($\\tau$ mayor). En emergencia, el XLPE llega hasta 105-130&nbsp;ºC.", "<b>Cortocircuito adiabático</b>: $I_{cc}\\sqrt t=K\\,S$ → $I_{cc}\\propto 1/\\sqrt t$ (no ∝ $t$)."]};

/* ===================== estado y almacenamiento ===================== */
const KEY='lsat-b1-quiz-v1';
let ST={};try{ST=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){ST={}}
ST.q=ST.q||{};ST.opt=ST.opt||{fast:false};ST.fav=ST.fav||{};ST.sims=ST.sims||[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}}
function rec(id,good){const s=ST.q[id]||{ok:0,ko:0};good?s.ok++:s.ko++;s.last=good?1:0;ST.q[id]=s;save()}
const SIM_N=40,PTS_OK=1,PTS_KO=0.5;
const BYID={};Q.forEach(q=>BYID[q.id]=q);
let S=null;
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(x,d=2)=>x.toFixed(d).replace('.',',');
const $=id=>document.getElementById(id);
function typeset(el){if(window.MathJax&&MathJax.typesetPromise){MathJax.typesetPromise([el]).catch(()=>{})}else{setTimeout(()=>typeset(el),300)}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const accent=v=>document.documentElement.style.setProperty('--accent',`var(${v})`);
const dom=q=>ST.q[q.id]&&ST.q[q.id].last===1, failed=q=>ST.q[q.id]&&ST.q[q.id].last===0, seen=q=>!!ST.q[q.id];
/* muestreo ponderado por veces que ha caído (simulacro) */
function weighted(list,n){const L=list.map(q=>({q,k:Math.pow(Math.random(),1/(q.veces||1))}));L.sort((a,b)=>b.k-a.k);return L.slice(0,n).map(x=>x.q)}
/* pares gemelos juntos */
function twinsList(){const out=[],done={};shuffle(Q.filter(q=>q.tw)).forEach(q=>{if(done[q.id])return;const t=BYID[q.tw];done[q.id]=1;out.push(q);if(t&&!done[t.id]){done[t.id]=1;out.push(t)}});return out}

   <button class="mode" id="m-fail" ${fl.length?'':'disabled'}><span class="ic" style="color:var(--ko)">!</span><span><h3>Repasar falladas</h3><p>${fl.length?'Las que fallaste la última vez':'Aún no has fallado ninguna'}</p></span><span class="n">${fl.length}</span></button>
   <button class="mode" id="m-fav" ${favs.length?'':'disabled'}><span class="ic" style="color:#C99A12">★</span><span><h3>Mis marcadas</h3><p>${favs.length?'Las que guardaste con la estrella':'Marca frases con ★ para repasarlas aquí'}</p></span><span class="n">${favs.length}</span></button>
   <button class="mode" id="m-all"><span class="ic">∑</span><span><h3>Repaso completo</h3><p>Todas, en orden por temas</p></span><span class="n">${n}</span></button>
   <button class="mode" id="m-rnd"><span class="ic">⤨</span><span><h3>Todas al azar</h3><p>Mismo banco, orden aleatorio</p></span><span class="n">${n}</span></button>
   <button class="mode" id="m-ideas"><span class="ic">✎</span><span><h3>Ideas clave</h3><p>La chuleta de cada tema: las reglas que resuelven casi todas las frases</p></span><span class="n">${Object.values(IDEAS).reduce((a,b)=>a+b.length,0)}</span></button>

  $('m-all').onclick=()=>go(Q,'Repaso completo');
  $('m-rnd').onclick=()=>go(shuffle(Q),'Todas al azar');
  $('m-ideas').onclick=()=>ideas();
  app.querySelectorAll('.tema').forEach(b=>b.onclick=()=>{const k=b.dataset.t;go(Q.filter(q=>q.tema===k),TEMAS[k].n+' · '+TEMAS[k].t)});
  $('o-fast').onchange=e=>{ST.opt.fast=e.target.checked;save()};
  const rb=$('o-reset');rb.onclick=()=>{if(rb.dataset.c){ST.q={};ST.sims=[];save();home()}else{rb.dataset.c=1;rb.textContent='Toca otra vez para confirmar (las marcadas se conservan)'}};

/* ===================== ideas clave ===================== */
function ideas(){
  accent('--c1');
  app.innerHTML=`<div class="top"><div class="toprow"><button class="back" id="b-back">← Inicio</button><div class="title">Ideas clave</div><div class="score"></div></div></div>
  <p class="lead">Una regla por línea. Si te sabes estas, casi todas las frases salen solas.</p>
  ${Object.entries(TEMAS).map(([k,t])=>(IDEAS[k]||[]).length?`<section class="idea" style="--c:var(${t.v})"><div class="ihead"><b>${t.n}</b> ${t.t}<button class="btn ghost sm" data-t="${k}">Practicar →</button></div><ul>${IDEAS[k].map(x=>`<li>${x}</li>`).join('')}</ul></section>`:'').join('')}`;
  $('b-back').onclick=home;
  app.querySelectorAll('.ihead .btn').forEach(b=>b.onclick=()=>{const k=b.dataset.t;start(Q.filter(q=>q.tema===k),TEMAS[k].n+' · '+TEMAS[k].t)});
  typeset(app);window.scrollTo(0,0);

/* ===================== sesión ===================== */
function start(list,name,mode,extra){
  if(!list.length)return;
  S=Object.assign({list,name,mode:mode||'study',i:0,res:[],ans:[],pts:0},extra||{});
  render();
}
function chips(q){
  let h=`<span class="qid">${q.id}</span>`;
  q.src.forEach(s=>h+=`<span class="chip${s.startsWith('Autoev')?' off':''}">${esc(s)}</span>`);
  if(q.veces>=2)h+=`<span class="chip hot">Ha caído ${q.veces} veces</span>`;
  if(q.c===1)h+=`<span class="chip dud">Dudosa</span>`;
  h+=`<button class="star${ST.fav[q.id]?' on':''}" id="b-star" aria-pressed="${!!ST.fav[q.id]}" title="Marcar para repasar">★</button>`;
  return h;
}
function scoreHTML(){
  if(S.mode==='sim'){const a=S.res.filter(r=>r!==undefined).length;return `<span>${S.i+1}/${S.list.length}</span><span>${a} resp.</span>`}
  if(S.mode==='review')return `<span>${S.i+1}/${S.list.length}</span>`;
  const g=S.res.filter(r=>r===1).length,b=S.res.filter(r=>r===0).length;
  return `<span>${S.i+1}/${S.list.length}</span><span class="g">✓ ${g}</span><span class="r">✗ ${b}</span>`;
}
function render(){
  const q=S.list[S.i],t=TEMAS[q.tema],sim=S.mode==='sim',rev=S.mode==='review';
  accent(t.v);
  app.innerHTML=`
  <div class="top"><div class="toprow"><button class="back" id="b-back">← Salir</button><div class="title">${esc(S.name)}</div>
   <div class="score">${scoreHTML()}</div></div>
   <div class="prog"><i style="width:${100*S.i/S.list.length}%"></i></div></div>
  <article class="card"><div class="chead">${chips(q)}</div>
   <div class="cbody"><div class="tag" style="color:var(${t.v})">${t.n} · ${t.t}</div><div class="q" id="qtext">${q.q}</div>
   <div class="vf"><button class="ch vfb" data-a="V"><span class="l">V</span><span class="t">Verdadera</span><span class="m"></span></button><button class="ch vfb" data-a="F"><span class="l">F</span><span class="t">Falsa</span><span class="m"></span></button></div>
   <div id="fb"></div></div>
   <div class="actions" id="act"></div></article>
  <div class="kbd">${sim?'Corrección al final · V / F / B (en blanco)':'V / F para responder'} · Intro para seguir</div>`;
  $('b-back').onclick=()=>{if(rev){S=S.back;results(false,true)}else if(S.res.some(r=>r!==undefined))results(true);else home()};
  $('b-star').onclick=e=>{const on=!ST.fav[q.id];if(on)ST.fav[q.id]=1;else delete ST.fav[q.id];save();e.currentTarget.classList.toggle('on',on);e.currentTarget.setAttribute('aria-pressed',on)};
  const act=$('act');
  if(rev){reviewShow(q);typeset(app);window.scrollTo(0,0);return}
  app.querySelectorAll('.vfb').forEach(b=>b.onclick=()=>sim?simAnswer(q,b.dataset.a):grade(q,b.dataset.a));
  if(sim){act.innerHTML=`<button class="btn ghost" id="b-blank">Dejar en blanco</button>`;$('b-blank').onclick=()=>simAnswer(q,null)}
  else{act.innerHTML=`<button class="btn ghost" id="b-skip">Saltar</button>`;$('b-skip').onclick=next}
  typeset(app);window.scrollTo(0,0);
}
function paint(q,a){
  app.querySelectorAll('.vfb').forEach(c=>{c.disabled=true;const v=c.dataset.a,m=c.querySelector('.m');
    if(v===q.a&&v===a){c.classList.add('ok');m.textContent='✓'}
    else if(v===q.a){c.classList.add('ok');m.textContent='correcta'}
    else if(v===a){c.classList.add('ko');m.textContent='✗'}
    else c.classList.add('dim')});
}
function feedback(q,good){
  let h='';
  if(good==='blank')h+=`<div class="verdict mut">— En blanco · es ${q.a==='V'?'VERDADERA':'FALSA'}</div>`;
  else h+=`<div class="verdict ${good?'ok':'ko'}">${good?'✓ Correcta':'✗ Incorrecta'} · es ${q.a==='V'?'VERDADERA':'FALSA'}</div>`;
  h+=`<div class="exp"><div class="lbl">Por qué</div>${q.e}</div>`;
  if(q.n)h+=`<div class="ojo"><b>Ojo · </b>${q.n}</div>`;
  if(q.tw){const t=BYID[q.tw];h+=`<div class="twin"><div class="lbl">Su gemela (cambia lo subrayado)</div>
    <div class="trow"><span class="tvf ${q.a==='V'?'v':'f'}">${q.a}</span><span>${q.qm}</span></div>
    <div class="trow"><span class="tvf ${t.a==='V'?'v':'f'}">${t.a}</span><span>${q.twm}</span></div></div>`}
  h+=`<div class="ref">Fuente · ${q.r}</div>`;
  const fb=$('fb');fb.innerHTML=`<div class="reveal">${h}</div>`;typeset(fb);
}
function grade(q,a){
  if(app.querySelector('.vfb').disabled)return;
  const good=a===q.a;paint(q,a);S.res[S.i]=good?1:0;rec(q.id,good);
  const sc=app.querySelector('.score');if(sc)sc.innerHTML=scoreHTML();
  if(good&&ST.opt.fast){setTimeout(()=>{if(S&&S.list[S.i]===q)next()},650);return}
  feedback(q,good);
  $('act').innerHTML=`<button class="btn" id="b-next">${S.i+1<S.list.length?'Siguiente →':'Ver resultado'}</button>`;
  const b=$('b-next');b.onclick=next;b.focus({preventScroll:true});
}
function simAnswer(q,a){
  if(a===null){S.res[S.i]=-1;S.ans[S.i]=null}
  else{const good=a===q.a;S.res[S.i]=good?1:0;S.ans[S.i]=a;rec(q.id,good);S.pts+=good?PTS_OK:-PTS_KO}
  next();
}
function reviewShow(q){
  const a=S.prev[S.i],r=S.prevRes[S.i];
  paint(q,a);feedback(q,r===1?true:r===0?false:'blank');
  $('act').innerHTML=`<button class="btn" id="b-next">${S.i+1<S.list.length?'Siguiente →':'Terminar la revisión'}</button>`;
  $('b-next').onclick=next;
}
function next(){
  if(S.i+1<S.list.length){S.i++;render()}
  else if(S.mode==='review'){S=S.back;results(false,true)}
  else results(false);
}

/* ===================== resultado ===================== */
function plain(h){let t=h.replace(/<[^>]+>/g,'').replace(/\$[^$]*\$/g,'…').replace(/\s+/g,' ').trim();return esc(t.length>110?t.slice(0,108)+'…':t)}
function byTema(pairs){
  const T={};pairs.forEach(([r,q])=>{const o=T[q.tema]=T[q.tema]||{g:0,n:0};o.n++;if(r===1)o.g++});
  const ks=Object.keys(TEMAS).filter(k=>T[k]);if(ks.length<2)return '';
  return `<section class="sec"><h2>Por tema</h2><div class="tbs">${ks.map(k=>{const o=T[k],p=Math.round(100*o.g/o.n);return `<div class="tb"><b style="color:var(${TEMAS[k].v})">${TEMAS[k].n}</b><span class="bar"><i style="width:${p}%"></i></span><span class="mono">${o.g}/${o.n}</span></div>`}).join('')}</div></section>`;
}
function results(early){
  const all=S.list.map((q,i)=>[S.res[i],q]);
  const done=all.filter(x=>x[0]!==undefined);
  const g=done.filter(x=>x[0]===1).length,b=done.filter(x=>x[0]===0).length,bl=S.list.length-g-b;
  const fails=done.filter(x=>x[0]===0).map(x=>x[1]);
  accent('--c1');
  let head,list='';
  if(S.mode==='sim'){
    const nota=Math.min(10,Math.max(0,S.pts*10/S.list.length));
    if(!early&&!S.saved){ST.sims.push({d:Date.now(),n:+nota.toFixed(2)});ST.sims=ST.sims.slice(-30);save();S.saved=true}
    head=`<div class="eyebrow">Simulacro · nota del test${early?' · interrumpido':''}</div><div class="big" style="color:${nota>=5?'var(--ok)':nota>=3?'var(--warn)':'var(--ko)'}">${fmt(nota)}<small> / 10</small></div><p style="margin:0;color:var(--muted)">${g} aciertos · ${b} fallos · ${bl} en blanco → ${fmt(S.pts,1)} puntos de ${S.list.length}. ${nota>=5?'Aprobado.':nota>=3?'Llegas al mínimo de 3 para hacer media.':'Por debajo del mínimo de 3.'}</p>`;
    list=`<section class="sec"><h2>Frase a frase</h2><div class="rlist">${all.map(([r,q])=>{const c=r===1?'ok':r===0?'':'bl',ic=r===1?'✓':r===0?'✗':'—';return `<div class="ritem ${c}"><span class="mono">${ic} ${q.id}</span><span>${plain(q.q)}</span></div>`}).join('')}</div></section>`;
  }else{
    head=`<div class="eyebrow">${esc(S.name)}${early?' · sesión interrumpida':''}</div><div class="big">${g}<small> / ${done.length}</small></div><p style="margin:0;color:var(--muted)">${done.length?Math.round(100*g/done.length):0} % de aciertos.</p>`;
    if(fails.length)list=`<section class="sec"><h2>Para repasar</h2><div class="rlist">${fails.map(q=>`<div class="ritem"><span class="mono">${q.id}</span><span>${plain(q.q)}</span></div>`).join('')}</div></section>`;
  }
  app.innerHTML=`<div class="res"><header class="hero" style="padding-top:20px">${head}</header>${byTema(done)}${list}
   <div class="actions" style="padding:0">${S.mode==='sim'?`<button class="btn" id="r-rev">Revisar con explicaciones</button>`:''}${fails.length?`<button class="btn ${S.mode==='sim'?'ghost':''}" id="r-f">Repetir las falladas</button>`:''}<button class="btn ghost" id="r-h">Volver al inicio</button></div></div>`;
  if(S.mode==='sim'){const p=S;$('r-rev').onclick=()=>start(p.list,'Revisión del simulacro','review',{prev:p.ans.slice(),prevRes:p.res.slice(),back:p})}
  if(fails.length)$('r-f').onclick=()=>start(fails,'Repetir falladas');
  $('r-h').onclick=home;typeset(app);window.scrollTo(0,0);
}

/* ===================== teclado ===================== */
document.addEventListener('keydown',e=>{
  if(!S||e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k==='v'||k==='f'||k==='1'||k==='2'){const a=(k==='v'||k==='1')?'V':'F';const b=app.querySelector(`.vfb[data-a="${a}"]`);if(b&&!b.disabled){e.preventDefault();b.click()}}
  if(k==='b'&&S.mode==='sim'){const b=$('b-blank');if(b){e.preventDefault();b.click()}}
  if(e.key==='Enter'){const b=$('b-next');if(b&&!b.disabled){e.preventDefault();b.click()}}
});
home();

</script>
